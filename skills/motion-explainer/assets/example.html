/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

#caption{position:absolute;z-index:4;left:95px;right:95px;bottom:67px;text-align:center;min-height:57px;line-height:1.45;letter-spacing:.6px;color:#fff;font-size:41px;font-weight:620;text-shadow:0 2px 5px #000,0 0 2px #000}
#progress{position:absolute;left:0;bottom:0;height:5px;background:var(--lime);transform-origin:left;z-index:5;width:100%}
.controls{position:fixed;z-index:8;bottom:9px;left:50%;transform:translateX(-50%);background:#171e19ef;border:1px solid #a9bba26b;border-radius:30px;display:flex;align-items:center;padding:6px 12px;gap:10px;color:white;font:14px system-ui}.controls button{background:none;border:0;color:white;font:inherit;cursor:pointer}.controls input{width:min(24vw,240px);accent-color:#d7e68a}.controls output{font:12px var(--mono);white-space:nowrap}.export .controls{display:none}
</style></head><body><div class="deck-viewport"><main class="deck-stage" id="stage">
<header class="top"><div class="brand"><span class="emblem"></span>动态解说工坊</div><div><span class="index" id="chapterNum">01 / 03</span><span id="chapter">一杯拿铁</span></div></header>
<section id="opening" class="slide active">
<div id="openCopy" class="pos"><p class="phase"><span class="rule"></span>模拟点单实验</p><h1>那杯拿铁，<br><em>为什么又加了糖？</em></h1><div id="past"><span class="dateTag">昨天</span>“以后点咖啡，都选无糖。”</div></div>
<div class="pos" id="ticketWrap"><article id="frontTicket" class="sheet ticket"><div class="receiptHead"><b id="slipType">饮品备忘</b><span id="slipLabel">昨日偏好</span></div><span class="cup"></span><h2 id="coffeeName">咖啡偏好</h2><div class="drinkMeta" id="coffeeDetail">以后点咖啡时适用</div><div class="sugarLine"><span>糖量</span><b class="wrong" id="wrong">标准糖</b></div><div class="barcode"></div></article></div>
</section>
<section id="experiment" class="slide"><div class="pos sectionHeading"><p class="phase"><span class="rule"></span>拆开这次点单</p><h2 class="lead" id="diagTitle">“无糖”存在哪儿？</h2></div>
<div id="diagram" class="pos"><div id="saved" class="pos box"><div class="cardTitle"><i class="stack"></i>已保存的偏好</div><div class="storeTitle">咖啡</div><div class="remembered">来自昨天的对话</div><span id="retained">无糖</span></div>
<div id="linklabel" class="pos">带入本轮</div><div id="route" class="pos"></div>
<article id="request" class="pos sheet"><div class="reqHeader">模型收到的请求<span>输入示意</span></div><div class="reqRow" id="userRow"><span class="field">用户说</span><span class="val">“帮我点杯拿铁。”</span></div><div class="reqRow" id="prefRow"><span class="field">饮品偏好</span><span id="empty" class="empty">这次没有带入</span></div><div class="note" id="reqNote">本轮对话 · 点单前</div></article>
<div id="chip">无糖</div><div class="pos" id="result"><span class="check">✓</span> 本次点单结果　无糖拿铁</div></div></section>
<section id="closing" class="slide"><div class="pos" id="finalCopy"><p class="phase"><span class="rule"></span>我会先查这一步</p><h2>回答之前，<br>模型到底<br><em id="underline">收到了什么？</em></h2></div>
<div id="orderEnd" class="pos"><article class="sheet ticket"><div class="receiptHead">点单小票<span>模拟订单</span></div><span class="cup"></span><h2>拿铁咖啡</h2><div class="drinkMeta">热饮 · 中杯 · 1 杯</div><div class="sugarLine"><span>糖量</span><span class="correct">无糖 ✓</span></div><div class="barcode"></div></article></div></section>
<div id="caption"></div><div id="progress"></div></main></div>
<audio id="voice" preload="auto" ></audio>
<div class="controls" aria-label="样片播放"><button id="play" aria-label="播放或暂停">播放</button><input id="scrub" aria-label="播放进度" type="range" min="0" step=".05"><output id="time"></output></div>
<script>
const story={
  "lines": [
    {
      "text": "假设昨天你跟助手说，以后帮我点咖啡，都选无糖。",
      "start": 0.0,
      "end": 4.9176875
    },
    {
      "text": "今天换个对话，一杯拿铁，又加了糖。",
      "start": 5.2576875,
      "end": 8.793791666666667
    },
    {
      "text": "是哪一步把无糖弄丢了？",
      "start": 9.343791666666666,
      "end": 11.297354166666667
    },
    {
      "text": "我们把这次请求摊开看。",
      "start": 11.957354166666667,
      "end": 14.168604166666666
    },
    {
      "text": "偏好里，无糖已经存好了。",
      "start": 14.488604166666667,
      "end": 16.896958333333334
    },
    {
      "text": "可这次发给模型的，只有一句，帮我点杯拿铁。",
      "start": 17.33695833333333,
      "end": 21.486770833333335
    },
    {
      "text": "现在只改一个地方。",
      "start": 22.156770833333333,
      "end": 23.762666666666668
    },
    {
      "text": "点单时，把那条已保存的偏好，一起放进请求。",
      "start": 24.112666666666666,
      "end": 28.833583333333333
    },
    {
      "text": "你看，同一句话，这次得到了一杯无糖拿铁。",
      "start": 29.383583333333334,
      "end": 33.326854166666664
    },
    {
      "text": "下次遇到这种情况，我会先看一眼，",
      "start": 33.94685416666667,
      "end": 37.317479166666665
    },
    {
      "text": "回答之前，模型到底收到了什么？",
      "start": 37.537479166666664,
      "end": 40.49975
    }
  ],
  "duration": 41.64975
};
const lines=story.lines, at=i=>lines[i].start, $=id=>document.getElementById(id);
window.DURATION=story.duration;
const exportMode=new URLSearchParams(location.search).has('render');
document.documentElement.classList.toggle('export',exportMode);
const reduced=!exportMode && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=x=>Math.max(0,Math.min(1,x));
function ease(t,start,d=.46){let x=clamp((t-start)/d);return reduced?Number(x>0):x*x*(3-2*x)}
function reveal(id,k,travel=16){let e=$(id);e.style.opacity=k;e.style.translate='0 '+(travel*(1-k))+'px'}
function scene(id,t,start,end){const opacity=(start===0?1:ease(t,start,.38))*(1-ease(t,end,.38));let el=$(id);el.classList.toggle('active',opacity>0);el.style.opacity=opacity;}
const scrub=$('scrub'),audio=$('voice');scrub.max=story.duration;
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
let now=0,playing=false,anchor=0,frame;
window.seekTo=function(t){
  now=Math.max(0,Math.min(Number(t),story.duration));
  const cut1=at(3)-.22, cut2=at(9)-.22;
  scene('opening',now,0,cut1);scene('experiment',now,cut1,cut2);scene('closing',now,cut2,story.duration+1);
  const part=now<cut1?0:now<cut2?1:2;
  $('chapterNum').textContent='0'+(part+1)+' / 03';$('chapter').textContent=['一杯拿铁','两次请求','排查记忆'][part];
  reveal('past',ease(now,.8,.7));
  const turn=ease(now,at(1)-.1,.8), today=turn>=.5;
  $('frontTicket').style.transform='perspective(1400px) rotateY('+((today?180:0)-180*turn)+'deg)';
  $('slipType').textContent=today?'点单小票':'饮品备忘';$('slipLabel').textContent=today?'模拟订单':'昨日偏好';
  $('wrong').textContent=today?'标准糖':'无糖';
  $('coffeeName').textContent=today?'拿铁咖啡':'咖啡偏好';$('coffeeDetail').textContent=today?'热饮 · 中杯 · 1 杯':'以后点咖啡时适用';
  $('wrong').style.setProperty('--strike',ease(now,at(1)+2,.4));
  $('diagTitle').textContent=now<at(6)?'“无糖”存在哪儿？':'让这条偏好跟上订单。';
  reveal('saved',ease(now,cut1+.1));reveal('request',ease(now,cut1+.48),34);
  reveal('userRow',ease(now,at(5)-.4));reveal('prefRow',ease(now,at(5)+.65));
  reveal('reqNote',ease(now,at(5)+.8));
  const travel=ease(now,at(7)+.77,1.6);
  $('empty').style.opacity=1-ease(now,at(7)+.55,.38);
  $('route').style.transform='scaleX('+ease(now,at(7)-.12,.65)+')';reveal('linklabel',ease(now,at(7)-.1));
  const chip=$('chip');chip.style.opacity=ease(now,at(4)-.1);chip.style.transform='translate('+((1135-361)*travel)+'px,'+((596-550)*travel-Math.sin(travel*Math.PI)*65)+'px)';
  $('retained').style.opacity=travel;
  const zoom=.074*(ease(now,at(5)-.18,.8)-ease(now,at(6)-.45,.7));
  $('diagram').style.transform='scale('+(1+zoom)+')';
  reveal('result',ease(now,at(8)+.85,.53)); reveal('orderEnd',ease(now,cut2+.12,.64),45);
  $('underline').style.setProperty('--underline',ease(now,at(10)+.2,1));
  const speaking=(story.captions || lines).find(c=>now>=c.start&&now<=c.end+.07);
  $('caption').textContent=speaking?speaking.text:'';
  $('progress').style.transform='scaleX('+now/story.duration+')';scrub.value=now;$('time').textContent=fmt(now)+' / '+fmt(story.duration);
};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')'}
function pause(){playing=false;audio.pause();cancelAnimationFrame(frame);$('play').textContent=now>=story.duration-.06?'重播':'播放'}
function tick(){if(!playing)return;window.seekTo(audio.hasAttribute('src')?audio.currentTime:(performance.now()-anchor)/1000);if(now>=story.duration-.04||audio.ended){window.seekTo(story.duration);pause()}else{frame=requestAnimationFrame(tick)}}
async function toggle(){if(playing){pause();return}if(now>=story.duration-.06)window.seekTo(0);if(audio.hasAttribute('src')){audio.currentTime=now;await audio.play()}anchor=performance.now()-now*1000;playing=true;$('play').textContent='暂停';tick()}
$('play').onclick=toggle;scrub.oninput=()=>{let t=Number(scrub.value);if(audio.hasAttribute('src'))audio.currentTime=t;anchor=performance.now()-t*1000;window.seekTo(t)};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}});
addEventListener('resize',fit);fit();window.seekTo(0);
</script></body></html>
